services:
  - type: web
    name: mobio-api
    env: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: HOST
        value: 0.0.0.0
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: AMADEUS_CLIENT_ID
        sync: false
      - key: AMADEUS_CLIENT_SECRET
        sync: false
      - key: HOTELS_API_KEY
        sync: false
      - key: HOTELS_API_BASE_URL
        value: https://api.hotels-api.com/v1/hotels/search
      - key: STRIPE_SECRET_KEY
        sync: false
