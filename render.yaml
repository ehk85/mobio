services:
  - type: web
    name: mobio-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 4000
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: AMADEUS_CLIENT_ID
        sync: false
      - key: AMADEUS_CLIENT_SECRET
        sync: false
      - key: HOTELS_API_KEY
        sync: false
      - key: HOTELS_API_BASE_URL
        value: https://api.hotels-api.com/v1/hotels/search
      - key: STRIPE_SECRET_KEY
        sync: false
